name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: TEST THE CODE 🧪
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    services:
      # We need a fake MongoDB to run tests against
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017
      # We need a fake Redis for the queue tests
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter (Check code style)
        run: npm run lint

      - name: Run Unit Tests 
        run: npm run test
        env:
          # Fake env vars for testing
          MONGO_URI: mongodb://localhost:27017/test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test_secret

  # JOB 2: CHECK DOCKER BUILD 🐳
  docker-check:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    needs: test # Only run if tests pass
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Build Docker Image
        run: docker build . --file Dockerfile

  # JOB 3: DEPLOY (CD) 🚀
  deploy-notification:
    name: Ready for Deploy
    runs-on: ubuntu-latest
    needs: [test, docker-check]
    steps:
      - name: Echo Deploy Status
        run: echo "Tests passed! Koyeb will now pick up the changes automatically."